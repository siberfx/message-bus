; /etc/supervisor/conf.d/message-bus-consume.conf

[program:message-bus-consume]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan message-bus:consume priority default --time-limit=3600 --memory-limit=256 --sleep=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/message-bus.log
; give the current message time to finish (SIGTERM stops the worker gracefully when pcntl is available)
stopwaitsecs=300
