; /etc/supervisor/conf.d/message-bus-queue.conf
; sudo supervisorctl reread && sudo supervisorctl update

[program:message-bus-messages]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work --queue=messages --sleep=1 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/queue-messages.log
stopwaitsecs=3600

[program:message-bus-newsletters]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work redis --queue=newsletters --timeout=600 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/queue-newsletters.log
stopwaitsecs=3600
